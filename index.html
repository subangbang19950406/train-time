<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>S3 时刻</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>S3 时刻</h1>
        <p class="sub">按方向选择上车 / 下车点</p>
        <p class="now" id="nowText"></p>
        <div class="direction-row">
          <span class="direction-label">方向</span>
          <div class="direction-track" id="directionSeg" role="radiogroup" aria-label="方向">
            <label class="direction-opt">
              <input type="radio" name="direction" value="gaojiachong" />
              <span>高家冲</span>
            </label>
            <label class="direction-opt">
              <input type="radio" name="direction" value="nanjingnan" />
              <span>南京南</span>
            </label>
          </div>
        </div>
      </header>

      <section class="query-bar panel" aria-label="查询条件">
        <div class="query-field">
          <span class="query-label">上</span>
          <div class="origin-dropdown" id="boardDropdown">
            <button
              type="button"
              class="origin-trigger origin-trigger-compact"
              id="boardTrigger"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="boardMenu"
            >
              <span class="origin-trigger-text" id="boardTriggerText"></span>
              <span class="origin-trigger-chevron" aria-hidden="true"></span>
            </button>
            <ul class="origin-menu" id="boardMenu" role="listbox" hidden></ul>
          </div>
        </div>
        <div class="query-field">
          <span class="query-label">下</span>
          <div class="origin-dropdown" id="alightDropdown">
            <button
              type="button"
              class="origin-trigger origin-trigger-compact"
              id="alightTrigger"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="alightMenu"
            >
              <span class="origin-trigger-text" id="alightTriggerText"></span>
              <span class="origin-trigger-chevron" aria-hidden="true"></span>
            </button>
            <ul class="origin-menu" id="alightMenu" role="listbox" hidden></ul>
          </div>
        </div>
        <div class="query-field query-field-cal">
          <span class="query-label">历</span>
          <div class="calendar-track" id="calendarSeg" role="radiogroup" aria-label="日历">
            <label class="calendar-opt">
              <input type="radio" name="calendar" value="weekday" />
              <span>工</span>
            </label>
            <label class="calendar-opt">
              <input type="radio" name="calendar" value="restDay" />
              <span>休</span>
            </label>
          </div>
        </div>
      </section>

      <section class="list" id="tripList" aria-live="polite"></section>
      <div class="empty" id="emptyState" hidden>今日已无剩余班次</div>

      <footer class="footer">
        数据来自兰花塘站官方站牌，经站间时差推算（约）。
        往高家冲仅含经停兰花塘的车次（不含刘村短交路）。
        列车时刻表仅供参考，具体以实际运营为准。
        <div class="version" id="versionText"></div>
      </footer>
    </main>

    <script src="js/data.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/version.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
